<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sıra - Sipariş Takip</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b2545;
            color: #134074;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #ee6c4d;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8d99ae;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0b2545;
        }
        .desc {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #ee6c4d;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: #ee6c4d;
            color: white;
        }
        .btn-primary:hover {
            background-color: #d95336;
        }
        .btn-notification {
            background-color: #134074;
            color: white;
        }
        .btn-notification:hover {
            background-color: #0b2545;
        }
        .status-box {
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .status-preparing {
            background-color: #e9ecef;
            color: #495057;
        }
        .status-ready {
            background-color: #d4edda;
            color: #155724;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Q-Sıra</h1>
        <div class="subtitle">Kafaye Kahve & Espresso</div>

        <!-- واجهة إدخال رقم الطلب -->
        <div id="input-section">
            <div class="section-title">Sipariş Numaranız</div>
            <div class="desc">Fişinizdeki sipariş numarasını giriniz</div>
            <input type="number" id="orderInput" placeholder="Örn: 50">
            <button class="btn btn-primary" onclick="trackOrder()">Siparişi Takip Et</button>
        </div>

        <!-- واجهة متابعة الطلب -->
        <div id="tracking-section" class="hidden">
            <div class="section-title">Sipariş Numaranız</div>
            <div id="displayOrderNum" style="font-size: 48px; font-weight: bold; color: #ee6c4d; margin-bottom: 15px;">--</div>
            
            <div id="statusBox" class="status-box status-preparing">
                Hazırlanıyor... ⏳
            </div>
        </div>

        <!-- زر موحد لتفعيل الإشعارات يختفي تلقائياً عند التفعيل -->
        <button id="notifBtn" class="btn btn-notification" onclick="requestNotificationPermission()">
            🔔 Bildirimleri Aç
        </button>
    </div>

    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const socket = io();
        let myOrderNumber = null;

        // التحقق مما إذا كان رقم الطلب موجوداً مسبقاً في الرابط (?order=X)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderParam = urlParams.get('order');
            if (orderParam) {
                document.getElementById('orderInput').value = orderParam;
                trackOrder();
            }
            checkNotificationState();
        };

        function trackOrder() {
            const val = document.getElementById('orderInput').value.trim();
            if (!val) {
                alert('Lütfen geçerli bir sipariş numarası giriniz!');
                return;
            }
            myOrderNumber = parseInt(val);
            document.getElementById('displayOrderNuminnerText', document.getElementById('displayOrderNum').innerText = myOrderNumber);
            document.getElementById('input-section').classList.add('hidden');
            document.getElementById('tracking-section').classList.remove('hidden');

            // إرسال رقم الطلب للسيرفر للانضمام لقناته الخاصة
            socket.emit('join-order', myOrderNumber);
        }

        // الاستماع لتحديثات حالة الطلب من السيرفر
        socket.on('order-status-update', (data) => {
            if (data.orderNumber === myOrderNumber) {
                const box = document.getElementById('statusBox');
                if (data.status === 'ready') {
                    box.className = 'status-box status-ready';
                    box.innerHTML = 'Siparişiniz Hazır! 🥳';
                    playAudioAndNotify('Siparişiniz Hazır!', `Sipariş #${myOrderNumber} teslim almaya hazırdır.`);
                } else if (data.status === 'completed') {
                    box.className = 'status-box status-preparing';
                    box.innerHTML = 'Tamamlandı ✅';
                }
            }
        });

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Tarayıcınız bildirimleri desteklemiyor.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('notifBtn').classList.add('hidden');
                    new Notification("Q-Sıra", { body: "Bildirimler başarıyla etkinleştirildi!" });
                } else {
                    alert("Bildirim izni reddedildi.");
                }
            });
        }

        function checkNotificationState() {
            if (Notification.permission === "granted") {
                document.getElementById('notifBtn').classList.add('hidden');
            }
        }

        function playAudioAndNotify(title, body) {
            const sound = document.getElementById('notifSound');
            if (sound) {
                sound.play().catch(e => console.log("Audio play blocked", e));
            }
            if (Notification.permission === "granted") {
                new Notification(title, { body: body });
            }
        }
    </script>
</body>
</html>
