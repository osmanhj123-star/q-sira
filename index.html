<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sıra - Sipariş Takip</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b2545;
            color: #134074;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #ee6c4d;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8d99ae;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0b2545;
        }
        .desc {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #ee6c4d;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: #ee6c4d;
            color: white;
        }
        .btn-primary:hover {
            background-color: #d95336;
        }
        .btn-notification {
            background-color: #134074;
            color: white;
        }
        .btn-notification:hover {
            background-color: #0b2545;
        }
        .status-box {
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .status-preparing {
            background-color: #e9ecef;
            color: #495057;
        }
        .status-ready {
            background-color: #d4edda;
            color: #155724;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Q-Sıra</h1>
        <div class="subtitle">Kaf
