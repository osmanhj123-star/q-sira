<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sıra - Kasa Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b2545;
            color: #134074;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #ee6c4d;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8d99ae;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #0b2545;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #ee6c4d;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: #2b9348;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1b632f;
        }
        #message {
            margin-top: 15px;
            font-weight: 700;
            color: #2b9348;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Q-Sıra</h1>
        <div class="subtitle">Kasa Paneli</div>

        <div class="section-title">Hazır olan sipariş numarasını giriniz</div>
        <input type="number" id="staffOrderInput" placeholder="Örn: 20">
        <button class="btn btn-primary" onclick="callOrder()">Müşteriyi Çağır 🔔</button>

        <div id="message"></div>
    </div>

    <script>
        const socket = io();

        function callOrder() {
            const val = document.getElementById('staffOrderInput').value.trim();
            if (!val) {
                alert('Lütfen bir sipariş numarası giriniz!');
                return;
            }

            const orderNumber = parseInt(val);

            // إرسال أمر تغيير الحالة إلى 'ready' للسيرفر
            socket.emit('update-status', {
                orderNumber: orderNumber,
                status: 'ready'
            });

            // عرض رسالة تأكيد على لوحة الكاشير
            document.getElementById('message').innerText = `Sipariş #${orderNumber} için bildirim gönderildi! ✅`;
            
            // تفريغ الحقل للطلب التالي
            document.getElementById('staffOrderInput').value = '';
            
            setTimeout(() => {
                document.getElementById('message').innerText = '';
            }, 4000);
        }
    </script>
</body>
</html>
