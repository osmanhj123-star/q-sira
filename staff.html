<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sıra - Personel Paneli</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background: #1e293b; padding: 35px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        h1 { color: #eb8317; margin-top: 0; }
        input {
            width: 80%; padding: 15px; font-size: 24px; text-align: center;
            border-radius: 10px; border: 2px solid #334155; background: #0f172a;
            color: white; margin: 15px 0; outline: none;
        }
        input:focus { border-color: #eb8317; }
        button {
            background: #22c55e; color: white; border: none; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 10px;
            width: 88%; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #16a34a; }
        .log { margin-top: 20px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="panel" id="loginPanel">
        <h1>Personel Girişi 🔒</h1>
        <p>Lütfen personel şifresini giriniz</p>
        <input type="password" id="pinInput" placeholder="••••" maxlength="6">
        <button id="loginBtn">Giriş Yap</button>
    </div>

    <!-- لوحة التحكم -->
    <div class="panel" id="controlPanel" style="display: none;">
        <h1>Q-Sıra Kasa Paneli</h1>
        <p>Hazır olan sipariş numarasını giriniz</p>
        <input type="number" id="readyOrderInput" placeholder="Örn: 50">
        <button id="notifyBtn">Müşteriyi Çağır 🔔</button>
        <div class="log" id="statusLog">Sistem aktif ve hazır.</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const STAFF_PIN = "1234"; // كلمة المرور الخاصة بالموظفين (يمكنك تغييرها)

        const loginPanel = document.getElementById('loginPanel');
        const controlPanel = document.getElementById('controlPanel');
        const pinInput = document.getElementById('pinInput');
        const readyOrderInput = document.getElementById('readyOrderInput');
        const statusLog = document.getElementById('statusLog');

        document.getElementById('loginBtn').addEventListener('click', () => {
            if (pinInput.value === STAFF_PIN) {
                loginPanel.style.display = 'none';
                controlPanel.style.display = 'block';
            } else {
                alert("Hatalı şifre!");
                pinInput.value = "";
            }
        });

        document.getElementById('notifyBtn').addEventListener('click', () => {
            const orderNum = readyOrderInput.value.trim();
            if (!orderNum) {
                alert("Lütfen sipariş numarası giriniz!");
                return;
            }
            socket.emit('order_ready', orderNum);
            statusLog.innerText = `✅ Sipariş #${orderNum} için bildirim gönderildi.`;
            readyOrderInput.value = "";
            readyOrderInput.focus();
        });
    </script>
</body>
</html>
